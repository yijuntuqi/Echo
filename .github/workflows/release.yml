# Release pipeline: build, sign, and publish Windows installers, plus the
# updater manifest (latest.json) that installed apps poll for new versions.
#
# Prerequisites (repo owner, one-time):
#   1. Generate the updater keypair:
#        npx @tauri-apps/cli signer generate -w "$env:USERPROFILE\.tauri\echo.key"
#      - paste the PUBLIC key into src-tauri/tauri.conf.json (plugins.updater.pubkey)
#      - keep the private key file safe and remember its password
#   2. Add repo secrets (Settings -> Secrets and variables -> Actions):
#        TAURI_SIGNING_PRIVATE_KEY            = contents of the .key file
#        TAURI_SIGNING_PRIVATE_KEY_PASSWORD   = the key's password
#   3. Push a tag (v0.1.0) or run the workflow manually to cut a release.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: v__VERSION__
          releaseName: 'Echo v__VERSION__'
          releaseBody: '下载下方的安装包；已安装的旧版本会在设置页自动提示更新。'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
