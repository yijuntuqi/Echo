[package]
name = "echo"
version = "1.0.0"
description = "Echo - AI Electronic Pet"
edition = "2021"
license = "MIT"
repository = "https://github.com/yijuntuqi/Echo"

[dependencies]
tauri = { version = "2.0", features = ["macros"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-autostart = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-stronghold = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-process = "2.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono", "uuid", "json"] }
sqlcipher = { version = "0.28", features = ["bundled"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
candle-core = "0.7"
candle-nn = "0.7"
candle-transformers = "0.7"
tokenizers = "0.19"
hf-hub = { version = "0.4", features = ["rustls"] }
tokio-cron-scheduler = { version = "0.11", features = ["tokio", "signal"] }
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["serde", "v4", "v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
libloading = "0.8"
dirs = "5.0"
async-trait = "0.1"
once_cell = "1.19"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }