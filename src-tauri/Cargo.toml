[package]
name = "echo"
version = "1.0.0"
description = "Echo - an AI electronic pet that lives on your desktop and phone"
authors = ["yijuntuqi"]
edition = "2021"
license = "MIT"
repository = "https://github.com/yijuntuqi/Echo"
rust-version = "1.82"

[lib]
name = "echo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"

# Storage. `migrate!` reads ../migrations at compile time; `chrono`/`json` back
# the row types and settings blob.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "macros",
  "migrate",
  "chrono",
  "json",
] }

# sqlx's `sqlite` feature links PLAIN SQLite, where `PRAGMA key` is a syntax
# error — the database would silently open unencrypted and onboarding would
# fail outright. This direct dependency unifies with sqlx's copy and swaps the
# bundled build for SQLCipher, making the key pragma real. Vendored OpenSSL
# because Windows has no system OpenSSL to link against.
libsqlite3-sys = { version = "0.30", features = [
  "bundled-sqlcipher",
  "bundled-sqlcipher-vendored-openssl",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-patch = "4"
thiserror = "2"

# Password derivation for SQLCipher.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = { version = "0.10", default-features = false }

# Networking: ChatAnywhere (OpenAI-compatible) and model downloads.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "charset",
  "http2",
] }
futures-util = "0.3"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
tokio-cron-scheduler = "0.11"

chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"

# Loads a gitignored local `.env` (e.g. ECHO_SHARED_KEY) at startup.
dotenvy = "0.15"

# Stores the generated database password in the OS credential vault
# (Windows Credential Manager / macOS Keychain / libsecret). Preferred over
# tauri-plugin-stronghold, which compiles libsodium from source.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "ansi",
  "env-filter",
  "registry",
] }

# Local embedding inference: Candle runs the downloaded bge-small-zh-v1.5
# safetensors on CPU (pure Rust, no Python); `tokenizers` is HF's Rust
# tokenizer that consumes the downloaded tokenizer.json. All candle crates
# stay in version lockstep.
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = "0.21"

[target.'cfg(windows)'.dependencies]
# WS_EX_LAYERED / WS_EX_TRANSPARENT for the click-through pet window; GDI
# regions so the expanded window only hits where the pet and panel actually
# are; DWM attribute to forbid non-client (title bar) rendering.
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
] }

[features]
# Enabled by `tauri build`; keeps devtools out of release binaries.
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
